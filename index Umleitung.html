<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- 1. Automatische Weiterleitung nach 0 Sekunden (für Browser) -->
    <meta http-equiv="refresh" content="0; url=https://lw-ux.github.io/Padel-Liga">
    <title>Wird weitergeleitet...</title>
    
    <!-- 2. Fallback-Link für Suchmaschinen (SEO) -->
    <link rel="canonical" href="https://lw-ux.github.io/Padel-Liga">
    
    <!-- 3. JavaScript-Weiterleitung als Sicherheitsnetz -->
    <script type="text/javascript">
        window.location.href = "https://lw-ux.github.io/Padel-Liga"
    </script>
</head>
<body>
    <!-- 4. Manueller Link, falls die automatische Weiterleitung fehlschlägt -->
    <p>Diese Seite ist umgezogen. Falls Sie nicht automatisch weitergeleitet werden, klicken Sie bitte hier: 
       <a href="https://lw-ux.github.io/Padel-Liga">Zur neuen Padel-Liga</a>
    </p>
</body>
</html>
