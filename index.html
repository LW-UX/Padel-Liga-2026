<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel-Liga 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="data/data.js"></script>
  <style>
    :root {
      --bg:         #111111;
      --surface:    #13131a;
      --surface2:   #1c1c26;
      --border:     #25252f;
      --accent:     #d4f53a;
      --accent2:    #3af5b4;
      --danger:     #f53a5a;
      --text:       #eeeef5;
      --muted:      #5a5a72;
      --dim:        #8888a8;
      --envidual:   #1B719C;
      --hanako:     #2B6D88;
      --headsquare: #E70713;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(12,12,15,0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px;
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.08em; color: var(--accent); }
    .logo span { color: var(--dim); font-size: 1rem; margin-left: 6px; }
    nav { display: flex; gap: 2px; }
    nav button {
      background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; font-weight: 500; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s;
    }
    nav button:hover { color: var(--text); background: var(--surface2); }
    nav button.active { color: var(--accent); background: var(--surface2); }

    /* ── HERO ── */
    .hero { padding: 5rem 2rem 3.5rem; max-width: 1100px; margin: 0 auto; }
    .hero-eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
    .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem, 10vw, 8rem); line-height: 0.9; letter-spacing: 0.02em; }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero-sub { color: var(--dim); font-size: 0.9rem; font-weight: 300; margin-top: 1rem; }

    /* ── MAIN ── */
    main { max-width: 1100px; margin: 0 auto; padding: 0 2rem 6rem; }
    .section { display: none; }
    .section.active { display: block; }

    /* ── SECTION HEADER ── */
    .sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .sh-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; }
    .sh-meta { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); }

    /* ── RANKING TABLE ── */
    .ranking-wrap { overflow-x: auto; }
    table.rt { width: 100%; border-collapse: collapse; }
    table.rt th {
      text-align: right; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    table.rt th.l { text-align: left; }
    table.rt td { padding: 14px 16px; border-bottom: 1px solid var(--border); text-align: right; }
    table.rt td.l { text-align: left; }
    table.rt tr:last-child td { border-bottom: none; }
    table.rt tbody tr { transition: background 0.1s; }
    table.rt tbody tr:hover { background: var(--surface); }

    .rn { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted); width: 36px; text-align: left !important; }
    .r1 .rn { color: var(--accent); font-weight: 700; }
    .r2 .rn { color: #bbb; }
    .r3 .rn { color: #c97b2e; }

    .pname { font-weight: 500; font-size: 0.95rem; }
    .firma-badge {
      display: inline-block; font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 100px; margin-left: 8px;
    }
    .firma-Envidual   { background: rgba(58,143,245,0.12); color: var(--envidual); }
    .firma-Hanako     { background: rgba(245,58,180,0.12); color: var(--hanako); }
    .firma-Headsquare { background: rgba(245,160,58,0.12); color: var(--headsquare); }

    .elo-val  { font-family: 'DM Mono', monospace; font-size: 1.05rem; font-weight: 500; color: var(--accent); }
    .elo-delta { font-family: 'DM Mono', monospace; font-size: 0.78rem; }
    .num-val  { font-family: 'DM Mono', monospace; font-size: 0.88rem; color: var(--text); }
    .pos { color: var(--accent2); }
    .neg { color: var(--danger); }
    .neu { color: var(--muted); }

    .bar-cell { width: 120px; }
    .bar-wrap { background: var(--border); border-radius: 2px; height: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

    /* ── CHART ── */
    .chart-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .chart-box-title { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
    .filter-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .filter-toggle-btns { display: flex; gap: 6px; }
    .fb {
      font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 500;
      padding: 3px 10px; border-radius: 100px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .fb.on { color: #000; border-color: transparent; }
    .fb-toggle {
      font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 500;
      padding: 4px 12px; border-radius: 100px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--dim); cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
    }
    .fb-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .chart-wrap { position: relative; height: 340px; }

    /* ── MATCHES ── */
    .spieltag-group { margin-bottom: 2.5rem; }
    .spieltag-label {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .match-list { display: flex; flex-direction: column; gap: 8px; }
    .mc {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.1rem 1.5rem;
      display: grid;
      grid-template-columns: 60px 1fr 130px 1fr 60px;
      align-items: center; gap: 16px;
    }
    .mc.pending { background: transparent; }
    .mc-date { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--dim); }
    .mc-team { display: flex; flex-direction: column; gap: 2px; }
    .mc-team.win .mc-players { font-weight: 600; color: var(--text); }
    .mc-team:not(.win) .mc-players { color: var(--dim); }
    .mc-players { font-size: 0.95rem; }
    .mc-score { text-align: center; }
    .mc-score-main { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; color: var(--text); line-height: 1; }
    .mc-score-detail { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--dim); margin-top: 3px; }
    .mc-pending-label { font-size: 0.78rem; color: var(--muted); text-align: center; font-style: italic; }
    .mc-nr { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); text-align: right; }

    @media (max-width: 768px) {
      .bar-cell { display: none; }
      .mc { grid-template-columns: 1fr; }
      .mc-nr { text-align: left; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">PADEL·LIGA <span>2026</span></div>
  <nav>
    <button class="active" onclick="nav('rangliste',this)">Rangliste</button>
    <button onclick="nav('verlauf',this)">Verlauf</button>
    <button onclick="nav('spiele',this)">Spiele</button>
  </nav>
</header>

<div class="hero">
  <div>
    <div class="hero-eyebrow">Saison 2026 · Elo-Ranking</div>
    <h1>PADEL<em>LIGA</em></h1>
    <div class="hero-sub">Headsquare &nbsp;×&nbsp; Hanako &nbsp;×&nbsp; Envidual</div>
  </div>
</div>

<main>

  <!-- RANGLISTE -->
  <section id="rangliste" class="section active">
    <div class="sh">
      <div class="sh-title">RANGLISTE</div>
      <div class="sh-meta" id="rl-meta"></div>
    </div>
    <div class="ranking-wrap">
      <table class="rt">
        <thead>
          <tr>
            <th class="l">#</th>
            <th class="l">Spieler</th>
            <th class="bar-cell"></th>
            <th>Spiele</th>
            <th>Siege</th>
            <th>Punkte</th>
            <th>Diff.</th>
            <th>Elo</th>
            <th>±</th>
          </tr>
        </thead>
        <tbody id="rl-body"></tbody>
      </table>
    </div>
  </section>

  <!-- VERLAUF -->
  <section id="verlauf" class="section">
    <div class="sh"><div class="sh-title">ELO-VERLAUF</div></div>
    <div class="chart-box">
      <div class="chart-box-title">Rating-Entwicklung</div>
      <div class="filter-controls">
        <div class="filter-toggle-btns">
          <button class="fb-toggle" onclick="toggleAll(true)">Alle an</button>
          <button class="fb-toggle" onclick="toggleAll(false)">Alle aus</button>
        </div>
        <div class="filter-row" id="filter-row"></div>
      </div>
      <div class="chart-wrap"><canvas id="eloChart"></canvas></div>
    </div>
  </section>

  <!-- SPIELE -->
  <section id="spiele" class="section">
    <div class="sh">
      <div class="sh-title">SPIELPLAN</div>
      <div class="sh-meta" id="sp-meta"></div>
    </div>
    <div id="spielplan"></div>
  </section>

</main>

<script>
const COLORS = ['#d4f53a','#3af5b4','#3a8ff5','#f5a03a','#f53ab4','#a03af5','#f5f53a','#3af5f5','#f53a5a','#7af53a','#f57a3a','#3a5af5','#f53af5','#5af5f5','#f5c43a','#3af58a','#f5503a','#c43af5'];

// ── NAV ───────────────────────────────────────────────────────────
function nav(id, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if (id === 'verlauf') initChart();
}

// ── RANKING ───────────────────────────────────────────────────────
function getPlayerStats(player) {
  const played = PADEL_DATA.matches.filter(m =>
    m.sieger !== null &&
    (m.team1.spieler.includes(player.name) || m.team2.spieler.includes(player.name))
  );
  let siege = 0, punkte = 0, satzDiff = 0;
  played.forEach(m => {
    const inT1 = m.team1.spieler.includes(player.name);
    const won = (inT1 && m.sieger === 1) || (!inT1 && m.sieger === 2);
    // Punkte: 2:0 = 3Pkt, 2:1 = 2Pkt, 1:2 = 1Pkt, 0:2 = 0Pkt
    const [s1, s2] = m.saetze.split(':').map(Number);
    const mySaetze = inT1 ? s1 : s2;
    const oppSaetze = inT1 ? s2 : s1;
    if (mySaetze === 2 && oppSaetze === 0) punkte += 3;
    else if (mySaetze === 2 && oppSaetze === 1) punkte += 2;
    else if (mySaetze === 1 && oppSaetze === 2) punkte += 1;
    else punkte += 0;
    satzDiff += mySaetze - oppSaetze;
    if (won) siege++;
  });
  return { spiele: played.length, siege, punkte, satzDiff };
}

function renderRanking() {
  // Sort by Punkte desc, then SatzDiff desc, then Elo desc
  const withStats = PADEL_DATA.players.map(p => ({ ...p, stats: getPlayerStats(p) }));
  withStats.sort((a,b) =>
    b.stats.punkte - a.stats.punkte ||
    b.stats.satzDiff - a.stats.satzDiff ||
    b.elo - a.elo
  );

  const maxElo = Math.max(...PADEL_DATA.players.map(p => p.elo));
  const minElo = 800;
  document.getElementById('rl-meta').textContent = withStats.length + ' Spieler';

  document.getElementById('rl-body').innerHTML = withStats.map((p, i) => {
    const pct = Math.max(0, Math.round(((p.elo - minElo) / (maxElo - minElo)) * 100));
    const hist = p.history;
    const delta = hist.length > 1 ? p.elo - hist[hist.length-2].elo : 0;
    const dStr = delta > 0 ? `<span class="pos">+${delta}</span>` : delta < 0 ? `<span class="neg">${delta}</span>` : `<span class="neu">—</span>`;
    const diff = p.stats.satzDiff >= 0 ? `+${p.stats.satzDiff}` : `${p.stats.satzDiff}`;
    return `<tr class="r${Math.min(i+1,4)}">
      <td class="rn l">${i+1}</td>
      <td class="l"><span class="pname">${p.name}</span><span class="firma-badge firma-${p.firma}">${p.firma}</span></td>
      <td class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div></td>
      <td class="num-val">${p.stats.spiele}</td>
      <td class="num-val">${p.stats.siege}</td>
      <td class="num-val">${p.stats.punkte}</td>
      <td class="num-val">${p.stats.spiele > 0 ? diff : '—'}</td>
      <td class="elo-val">${p.elo}</td>
      <td class="elo-delta">${dStr}</td>
    </tr>`;
  }).join('');
}

// ── MATCHES ───────────────────────────────────────────────────────
function renderSpiele() {
  const spieltage = [...new Set(PADEL_DATA.matches.map(m => m.spieltag))].sort((a,b)=>a-b);
  const played = PADEL_DATA.matches.filter(m => m.sieger !== null).length;
  document.getElementById('sp-meta').textContent = `${played} / ${PADEL_DATA.matches.length} gespielt`;

  document.getElementById('spielplan').innerHTML = spieltage.map(st => {
    const matches = PADEL_DATA.matches.filter(m => m.spieltag === st);
    const rows = matches.map(m => {
      const d = new Date(m.datum);
      const ds = d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});

      if (m.sieger === null) {
        return `<div class="mc pending">
          <div class="mc-date">${ds}</div>
          <div class="mc-team"><div class="mc-players">${m.team1.spieler.join(' & ')}</div></div>
          <div class="mc-score"><div class="mc-pending-label">ausstehend</div></div>
          <div class="mc-team"><div class="mc-players">${m.team2.spieler.join(' & ')}</div></div>
          <div class="mc-nr">${m.id.replace('spiel','Sp.')}</div>
        </div>`;
      }

      const t1w = m.sieger === 1, t2w = m.sieger === 2;
      const [s1, s2] = m.saetze.split(':');
      return `<div class="mc played">
        <div class="mc-date">${ds}</div>
        <div class="mc-team ${t1w?'win':''}"><div class="mc-players">${m.team1.spieler.join(' & ')}</div></div>
        <div class="mc-score">
          <div class="mc-score-main">${s1}:${s2}</div>
          <div class="mc-score-detail">${m.ergebnis}</div>
        </div>
        <div class="mc-team ${t2w?'win':''}"><div class="mc-players">${m.team2.spieler.join(' & ')}</div></div>
        <div class="mc-nr">${m.id.replace('spiel','Sp.')}</div>
      </div>`;
    }).join('');

    const label = st === 7 ? 'Spieltag 7 – Ausgleichsspieltag' : `Spieltag ${st}`;
    return `<div class="spieltag-group">
      <div class="spieltag-label">${label}</div>
      <div class="match-list">${rows}</div>
    </div>`;
  }).join('');
}

// ── CHART ─────────────────────────────────────────────────────────
let chart = null;
const activeP = new Set(PADEL_DATA.players.map(p => p.id));

function initChart() {
  if (chart) return;
  const allDates = [...new Set(PADEL_DATA.players.flatMap(p => p.history.map(h => h.date)))].sort();
  const ctx = document.getElementById('eloChart').getContext('2d');
  const datasets = PADEL_DATA.players.map((p, i) => ({
    label: p.name,
    data: allDates.map(d => { const pts = p.history.filter(h => h.date <= d); return pts.length ? pts[pts.length-1].elo : null; }),
    borderColor: COLORS[i], backgroundColor: COLORS[i]+'15',
    borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, tension: 0.3, spanGaps: true
  }));
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: allDates.map(d => new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#13131a', borderColor: '#25252f', borderWidth: 1,
          titleColor: '#5a5a72', bodyColor: '#eeeef5',
          bodyFont: { family: 'DM Mono' },
          callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}` }
        }
      },
      scales: {
        x: { grid: { color: '#1c1c26' }, ticks: { color: '#5a5a72', font: { family: 'DM Mono', size: 11 } } },
        y: { grid: { color: '#1c1c26' }, ticks: { color: '#5a5a72', font: { family: 'DM Mono', size: 11 } } }
      }
    }
  });
  renderFilter();
}

function renderFilter() {
  document.getElementById('filter-row').innerHTML = PADEL_DATA.players.map((p,i) => {
    const on = activeP.has(p.id);
    return `<button class="fb ${on?'on':''}" style="${on?`background:${COLORS[i]};`:''}" onclick="toggleP('${p.id}',${i},this)">${p.name}</button>`;
  }).join('');
}

function toggleP(id, i, btn) {
  const ds = chart.data.datasets[i];
  ds.hidden = !ds.hidden;
  if (ds.hidden) { activeP.delete(id); btn.classList.remove('on'); btn.style = ''; }
  else { activeP.add(id); btn.classList.add('on'); btn.style = `background:${COLORS[i]};`; }
  chart.update();
}

function toggleAll(on) {
  PADEL_DATA.players.forEach((p, i) => {
    chart.data.datasets[i].hidden = !on;
    if (on) activeP.add(p.id); else activeP.delete(p.id);
  });
  chart.update();
  renderFilter();
}

// ── INIT ──────────────────────────────────────────────────────────
renderRanking();
renderSpiele();
</script>
</body>
</html>
